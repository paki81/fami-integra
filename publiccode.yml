description:
  it:
    localisedName: FAMI INTEGRA
    genericName: Piattaforma per Centri Sportello
    shortDescription: >-
      Banca dati intelligente per matching di beneficiari in uscita da progetti SAI con alloggi e opportunità lavorative.
    longDescription: >-
      FAMI INTEGRA è una piattaforma web per Centri Sportello che gestisce l'anagrafica
      dei beneficiari, il matching automatico con alloggi disponibili e opportunità
      di lavoro, i servizi welfare con generazione PDF, e la co-progettazione dei
      Piani Individuali di Inserimento Socio-Economico. Sviluppata da paki81 su
      intuizione di Giovanni Campese, ex sindaco di Monteleone di Puglia.
    features:
      - Matching alloggi con punteggio 0-100
      - Matching aziende su competenze e territorio
      - Anagrafica beneficiari con nucleo familiare
      - Geolocalizzazione su mappa Leaflet
      - Galleria foto alloggi
      - Registro note per beneficiari, alloggi, aziende
      - Consultazioni welfare con PDF personalizzato
      - Dashboard con statistiche in tempo reale
      - Import Excel / Export XLSX e CSV
      - RBAC con 5 ruoli e audit log
      - Personalizzazione branding senza codice
    screenshots: []
    videos: []
  en:
    localisedName: FAMI INTEGRA
    genericName: Help desk centre platform
    shortDescription: >-
      Smart database matching beneficiaries leaving SAI asylum projects with housing and job opportunities.
    longDescription: >-
      FAMI INTEGRA is a web platform for help desk centres (Centri Sportello): beneficiary
      registry, automatic matching with available housing and job opportunities, welfare
      services with PDF generation, and co-design of individual socio-economic integration
      plans. Developed by paki81 from an idea by Giovanni Campese, former mayor of
      Monteleone di Puglia.
    features:
      - Housing matching with 0-100 score
      - Company matching on skills and territory
      - Beneficiary registry with family unit
      - Leaflet map geolocation
      - Housing photo gallery
      - Notes log for beneficiaries, housing and companies
      - Welfare consultations with custom PDF
      - Real-time statistics dashboard
      - Excel import / XLSX and CSV export
      - RBAC with 5 roles and audit log
      - No-code branding customization
    screenshots: []
    videos: []
